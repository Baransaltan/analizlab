:root{--bg:#0d1117;--card:#161b22;--card2:#1c2230;--line:#262d3a;--tx:#e8edf4;--mu:#8b96a8;--ac:#4ade80;--ac2:#22c55e;--am:#fbbf24;--rd:#f87171;--bl:#60a5fa;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#22c55e,#0ea5e9);display:grid;place-items:center;font-weight:800;font-size:14px;color:#04110a}
.brand h1{font-size:19px;font-weight:750;letter-spacing:-.3px}
.brand small{display:block;color:var(--mu);font-size:12px;font-weight:500;letter-spacing:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mu);font-size:13px;font-weight:600}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.hi.on{background:var(--ac);border-color:var(--ac);color:#04110a}
main{padding:10px 14px}
.sec{color:var(--mu);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.mh{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;font-weight:600;margin-bottom:8px}
.teams{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.tn{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:flex;gap:3px}
.form i{width:7px;height:7px;border-radius:50%;background:var(--mu)}
.form i.G{background:var(--ac)}.form i.B{background:var(--am)}.form i.M{background:var(--rd)}
.bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:12px 0 5px;gap:2px}
.bar b{display:block}
.b1{background:var(--ac)}.bX{background:#64748b}.b2{background:var(--bl)}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.bl span b{color:var(--tx);font-weight:650}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.st{background:var(--card2);border-radius:10px;padding:8px;text-align:center}
.st b{display:block;font-size:15px}
.st span{font-size:11px;color:var(--mu)}
.picks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pk{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;background:var(--card2);border:1px solid var(--line)}
.pk.yuksek{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.08)}
.pk .l{font-weight:650}
.pk .c{font-size:11px;color:var(--mu);display:block;font-weight:500}
.pk .v{text-align:right;font-weight:750;font-size:16px}
.tag{font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.yuksek{background:var(--ac);color:#04110a}.tag.orta{background:#334155;color:#cbd5e1}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--mu)}
.card.open .more{display:block}
.row{display:flex;justify-content:space-between;padding:3px 0}
.row b{color:var(--tx);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.kpi span{font-size:11.5px;color:var(--mu)}
.res{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.res:last-child{border:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.dot.y{background:rgba(74,222,128,.15);color:var(--ac)}.dot.n{background:rgba(248,113,113,.15);color:var(--rd)}
.res .t{flex:1;min-width:0}.res .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .t small{color:var(--mu);font-size:12px}
.prose p{color:#c3cbd8;margin-bottom:12px}
.prose h3{font-size:15px;margin:16px 0 6px}
.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:12px;padding:12px;color:#fde68a;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:600 11px/1.2 inherit;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav button.on{color:var(--ac)}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px;gap:14px}
.gate h2{font-size:22px}.gate p{color:var(--mu)}
.btn{background:var(--ac);color:#04110a;border:0;border-radius:12px;padding:14px;font:700 15px inherit}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
</style>
</head>

  var T=DATA.track||{},C=T.cat||[],n=0,hit=0;C.forEach(function(c){n+=c.n;hit+=c.hit});
  var h='<main><div class="sec">Sonuçlanan analizler</div><div class="big"><div class="kpi"><b>'+n+'</b><span>analiz</span></div><div class="kpi"><b>'+hit+'</b><span>doğru</span></div><div class="kpi"><b style="color:var(--ac)">'+(n?Math.round(hit/n*100):0)+'%</b><span>isabet</span></div></div>';
  h+='<div class="sec">Kategoriye göre</div><div class="card">'+C.map(function(c){return'<div class="row" style="padding:7px 0"><span>'+esc(c.k)+' <small style="color:var(--mu)">('+c.n+')</small></span><b>'+Math.round(c.hit/c.n*100)+'%</b></div>'}).join('')+'</div>';
  var R=T.recent||[];
  if(R.length) h+='<div class="sec">Son sonuçlar</div><div class="card" style="padding:4px 14px">'+R.map(function(r){return'<div class="res"><span class="dot '+(r.ok?'y':'n')+'">'+(r.ok?'✓':'✕')+'</span><div class="t"><div>'+esc(r.m)+'</div><small>'+esc(r.s)+' · model '+pc(r.p)+'</small></div><b>'+esc(r.sc||'')+'</b></div>'}).join('')+'</div>';
  return h+'<p style="color:var(--mu);font-size:12px;margin:12px 4px">Tüm analizler maç başlamadan önce kaydedilir ve sonuçlar silinmeden olduğu gibi gösterilir.</p></main>';
}
function hakkinda(){
  return'<main class="prose"><div class="sec">Analiz Lab nedir?</div><div class="card"><p>Analiz Lab, futbol maçlarını istatistik ve veri modeliyle inceleyen bir analiz uygulamasıdır. Her maç için, son sezonlarda oynanmış on binlerce maç arasından en çok benzeyenleri bulur ve bu maçlarda hangi sonuçların ne sıklıkla gerçekleştiğini gösterir.</p>'
  +'<h3>Güven seviyeleri</h3><p><b>Yüksek</b>: model bu sonucu geçmişte güçlü biçimde desteklemiş. <b>Orta</b>: destek var ama daha zayıf. Güven seviyesi kesinlik anlamına gelmez.</p>'
  +'<h3>Neler gösterilir?</h3><p>Form, puan durumu, beklenen gol (xG), dinlenme süresi, beklenen korner ve kart sayıları ile model olasılıkları.</p></div>'
  +'<div class="warn">Analiz Lab bir bahis uygulaması değildir; bahis oynatmaz, bahis sitelerine yönlendirmez, bahis tavsiyesi vermez. İçerik yalnızca bilgi amaçlıdır ve 18 yaşından büyükler içindir. Geçmiş isabet oranları gelecekteki sonuçları garanti etmez.</div>'
  +'<p style="color:var(--mu);font-size:12px;margin:14px 4px">Veriler her gün güncellenir.</p></main>';
}
function render(){
  if(!DATA){document.getElementById('view').innerHTML='<div class="empty"><b>Yükleniyor…</b></div>';return}
  if(DATA.gen) document.getElementById('gen').textContent='Güncellendi: '+new Date(DATA.gen).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  document.getElementById('view').innerHTML=S.t==='m'?matches():S.t==='b'?basari():hakkinda();
}
document.addEventListener('click',function(ev){
  var n=ev.target.closest('nav button');if(n){S.t=n.dataset.t;document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b===n)});render();scrollTo(0,0);return}
  var d=ev.target.closest('[data-day]');if(d){S.day=d.dataset.day;render();return}
  if(ev.target.closest('[data-hi]')){S.hi=!S.hi;render();return}
  var c=ev.target.closest('.card[data-id]');if(c){S.open[c.dataset.id]=!S.open[c.dataset.id];c.classList.toggle('open')}
});
function gate(){
  if(st('al18')==='1')return;
  var g=document.createElement('div');g.className='gate';
  g.innerHTML='<div class="logo" style="width:52px;height:52px;font-size:22px;border-radius:14px">AL</div><h2>Analiz Lab</h2><p>Bu uygulama futbol istatistikleri ve model analizleri içerir. Bahis oynatmaz ve bahis tavsiyesi vermez. Devam etmek için 18 yaşından büyük olmalısın.</p><button class="btn" id="y18">18 yaşından büyüğüm</button><button class="btn g" id="n18">Değilim</button>';
  document.body.appendChild(g);
  g.querySelector('#y18').onclick=function(){st('al18','1');g.remove()};
  g.querySelector('#n18').onclick=function(){g.innerHTML='<h2>Üzgünüz</h2><p>Analiz Lab yalnızca 18 yaş ve üzeri kullanıcılar içindir.</p>'};
}
gate();render();
if(DATA_URL){fetch(DATA_URL,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){DATA=d;render()}).catch(function(){})}
</script>
</body>
</html>
